---
# ------------------------------------------------------------
# group_vars/monitoring.yml - how to log in to the monitoring servers
#
# The servers are in PRIVATE subnets (no public IP), so Ansible
# "jumps" through the bastion host. The bastion's public IP also
# comes from the dynamic inventory - nothing is hard-coded.
# ------------------------------------------------------------
ansible_user: ubuntu
ansible_host: "{{ private_ip_address }}"
ansible_ssh_private_key_file: "{{ ssh_key_file }}"

ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o ProxyCommand="ssh -i {{ ssh_key_file }}
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -W %h:%p ubuntu@{{ hostvars['bastion-host'].public_ip_address }}"