# Ansible settings for this project
[defaults]
# dynamic inventory: asks AWS for the server list
inventory = inventory/aws_ec2.yml
# don't ask "are you sure?" when connecting to brand-new servers
host_key_checking = False
interpreter_python = auto_silent
# show task results as easy-to-read YAML
callback_result_format = yaml

[inventory]
enable_plugins = amazon.aws.aws_ec2
